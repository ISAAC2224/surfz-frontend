
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accessories | SURFZ RESELLS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff; 
      color: #000;
      font-family: 'Arial Black', sans-serif;
    }
    nav {
      background-color: #000;
      padding: 1rem 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }
    nav a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 10px;
      transition: 0.3s;
    }
    nav a:hover {
      background-color: #fff;
      color: #000;
    }
    h1 {
      text-align: center;
      margin-top: 2rem;
      font-size: 2.5rem;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }
    .product {
      width: 300px;
      text-align: center;
      border: 2px solid #ccc;
      padding: 1rem;
      border-radius: 12px;
      background: #f9f9f9;
    }
    .product img {
      width: 100%;
      height: 300px;
      object-fit: contain;
      border-radius: 10px;
      background: white;
      cursor: pointer;
    }
    .product h2 {
      font-size: 1.2rem;
      margin-top: 1rem;
    }
    .buy-button {
      margin-top: 1rem;
    }
    .buy-button button {
      padding: 10px 20px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background-color: #00ffcc;
      color: black;
      cursor: pointer;
    }
    .cart-icon {
      position: fixed;
      top: 15px;
      right: 20px;
      background-color: #00ffcc;
      color: black;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      z-index: 999;
    }
    .cart-icon:hover {
      background-color: #00ddb3;
    }
    .footer {
      margin-top: 4rem;
      background: #111;
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <nav>
  <a href="index.html">Home</a>
  <a href="footwear.html">Footwear</a>
  <a href="clothing.html">Clothing</a>
  <a href="shorts.html">Shorts</a>
  <a href="bags.html">Bags</a>
  <a href="headphones.html">Headphones</a>
  <a href="accessories.html">Accessories</a>
</nav>



  <a href="cart.html" class="cart-icon">🛒 Cart (<span id="cart-count">0</span>)</a>

  <h1>Accessories</h1>
  <div class="grid" id="product-grid"></div>

  <div class="footer">
    <p>&copy; 2025 SURFZ RESELLS | All Rights Reserved</p>
  </div>

  <script>
    const products = [
      {
        name: "Louis Vuitton My Monogram Eclipse Hat",
        price: 245,
        images: ["LVEH1.png"],
        sizes: []
      }
    ];

    let imageIndexes = Array(products.length).fill(0);

    function rotateImage(id, idx) {
      imageIndexes[idx] = (imageIndexes[idx] + 1) % products[idx].images.length;
      document.getElementById(id).src = products[idx].images[imageIndexes[idx]];
    }

    function addToCart(name, price) {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.push({ name, price });
      localStorage.setItem("cart", JSON.stringify(cart));
      alert("Added to cart!");
      updateCartCount();
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      document.getElementById("cart-count").textContent = cart.length;
    }

    function createProductHTML(product, index) {
      return `
        <div class="product">
          <img id="accImg${index}" src="${product.images[0]}" onclick="rotateImage('accImg${index}', ${index})" alt="${product.name}">
          <h2>${product.name}</h2>
          <p>$${product.price}</p>
          <div class="buy-button">
            <button onclick="addToCart('${product.name}', ${product.price})">Add to Cart</button>
          </div>
        </div>
      `;
    }

    document.getElementById("product-grid").innerHTML = products.map(createProductHTML).join("");
    updateCartCount();
  </script>

</body>
</html>
