<script>
  function normalizeName(name) {
    return name
      .replace(/[‘’]/g, "'")
      .replace(/[“”]/g, '"')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function loadCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const tbody = document.getElementById("cart-items");
    let total = 0;
    tbody.innerHTML = "";

    cart.forEach((item, index) => {
      const tr = document.createElement("tr");
      total += item.price;

      const imageCell = `<img src="https://surfz-backend.onrender.com/images/${item.image}" alt="${item.name}">`;
      const detailCell = `<strong>${item.name}</strong>`;

      tr.innerHTML = `
        <td>${imageCell}</td>
        <td>${detailCell}</td>
        <td>$${item.price}</td>
        <td><button class="remove-btn" onclick="removeItem(${index})">Remove</button></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("cart-total").textContent = `Total: $${total}`;
  }

  function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
  }

  function checkout() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    const cleanedCart = cart.map(item => ({
      name: normalizeName(item.name),
      price: item.price
    }));

    console.log("📦 Sending cart to backend:", cleanedCart);

    fetch("https://surfz-backend.onrender.com/create-checkout-session", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ items: cleanedCart })
    })
    .then((res) => res.json())
    .then((data) => {
      if (data.url) {
        window.location.href = data.url;
      } else {
        console.warn("⚠️ Stripe session not started:", data);
        alert("Stripe session failed to start.");
      }
    })
    .catch((err) => {
      console.error("❌ Checkout error:", err);
      alert("Error creating checkout session.");
    });
  }

  loadCart();
</script>
