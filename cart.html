<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | SURFZ RESELLS</title>
  <style>
    body {
      font-family: 'Arial Black', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      color: #000;
    }

    nav {
      background-color: #000;
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 10px;
      transition: 0.3s;
    }

    nav a:hover {
      background-color: #fff;
      color: #000;
    }

    h1 {
      text-align: center;
      margin: 2rem 0;
    }

    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
    }

    th, td {
      padding: 1rem;
      text-align: left;
    }

    th {
      background-color: #f4f4f4;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    img {
      width: 60px;
      height: auto;
      display: block;
    }

    .remove-btn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .total {
      text-align: right;
      font-weight: bold;
      font-size: 1.2rem;
      margin-right: 5%;
      margin-top: 1rem;
    }

    .checkout-btn {
      display: block;
      margin: 2rem auto;
      padding: 10px 30px;
      background-color: #00ffcc;
      color: black;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .footer {
      background: #111;
      color: #fff;
      text-align: center;
      padding: 1.5rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="footwear.html">Footwear</a>
  <a href="clothing.html">Clothing</a>
  <a href="shorts.html">Shorts</a>
  <a href="bags.html">Bags</a>
  <a href="headphones.html">Headphones</a>
  <a href="accessories.html">Accessories</a>
</nav>

<h1>Your Cart</h1>
<table>
  <thead>
    <tr>
      <th>Image</th>
      <th>Name & Size</th>
      <th>Price</th>
      <th>Remove</th>
    </tr>
  </thead>
  <tbody id="cart-items"></tbody>
</table>
<div class="total" id="cart-total">Total: $0</div>
<button class="checkout-btn" onclick="checkout()">Buy Now</button>

<div class="footer">
  <p>&copy; 2025 SURFZ RESELLS | All Rights Reserved</p>
</div>

<script>
  function loadCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const tbody = document.getElementById("cart-items");
    let total = 0;
    let rows = "";

    for (let i = 0; i < cart.length; i++) {
      const item = cart[i];
      total += item.price;

      rows += \`
        <tr>
          <td><img src="https://surfz-backend.onrender.com/images/\${item.image}" alt="\${item.name}" /></td>
          <td><strong>\${item.name}</strong><br>Size: \${item.size}</td>
          <td>$\${item.price}</td>
          <td><button class="remove-btn" onclick="removeItem(\${i})">Remove</button></td>
        </tr>
      \`;
    }

    tbody.innerHTML = rows;
    document.getElementById("cart-total").textContent = "Total: $" + total;
    console.log("🛒 Loaded cart:", cart);
  }

  function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
  }

  function checkout() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    const normalizedCart = cart.map(item => {
      const cleanName = item.name
        .replace(/[‘’]/g, "'")
        .replace(/[“”]/g, '"')
        .replace(/[–—]/g, "-")
        .replace(/\(Size:.*?\)/g, "")
        .trim();
      return { ...item, name: cleanName };
    });

    fetch("https://surfz-backend.onrender.com/create-checkout-session", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ items: normalizedCart })
    })
    .then((res) => res.json())
    .then((data) => {
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert("Stripe session failed.");
      }
    })
    .catch(() => alert("Error starting checkout."));
  }

  document.addEventListener("DOMContentLoaded", loadCart);
</script>

</body>
</html>
