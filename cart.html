
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | SURFZ RESELLS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial Black', sans-serif;
      background-color: #fff;
      color: #000;
    }
    nav {
      background-color: #000;
      padding: 1rem 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
    }
    nav a {
      text-decoration: none;
      color: #fff;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 10px;
      transition: 0.3s;
    }
    nav a:hover {
      background-color: #fff;
      color: #000;
    }
    h1 {
      text-align: center;
      margin: 2rem 0;
      font-size: 2.5rem;
    }
    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      margin-bottom: 2rem;
    }
    th, td {
      padding: 1rem;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    img {
      width: 60px;
      height: auto;
    }
    .remove-btn {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    .total {
      text-align: right;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 1rem 5%;
    }
    .checkout-btn {
      display: block;
      margin: 1rem auto;
      padding: 10px 30px;
      font-weight: bold;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background-color: #00ffcc;
      color: black;
      cursor: pointer;
    }
    .footer {
      background: #111;
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="footwear.html">Footwear</a>
  <a href="clothing.html">Clothing</a>
  <a href="shorts.html">Shorts</a>
  <a href="bags.html">Bags</a>
  <a href="headphones.html">Headphones</a>
  <a href="accessories.html">Accessories</a>
</nav>

<h1>Your Cart</h1>
<table>
  <thead>
    <tr>
      <th>Product</th>
      <th>Details</th>
      <th>Price</th>
      <th>Remove</th>
    </tr>
  </thead>
  <tbody id="cart-items"></tbody>
</table>
<div class="total" id="cart-total">Total: $0</div>
<button class="checkout-btn" onclick="checkout()">Buy Now</button>

<div class="footer">
  <p>&copy; 2025 SURFZ RESELLS | All Rights Reserved</p>
</div>

<script>
  function loadCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const tbody = document.getElementById("cart-items");
    let total = 0;
    tbody.innerHTML = "";

    cart.forEach((item, index) => {
  let sizeLine = "";
  if (item.size && item.size !== "N/A" && item.size !== "undefined") {
    sizeLine = `<br><strong>Size:</strong> ${item.size}`;
  }
      const price = item.price || 0;
      const image = item.image || "placeholder.png";
      const name = item.name || "Unknown Product";
      const size = item.size || "N/A";
      total += price;

      const tr = document.createElement("tr");
      const imageCell = `<img src="https://surfz-backend.onrender.com/images/${image}" alt="${name}">`;
      const detailLabel = name.toLowerCase().includes("bag") ? "Color" : "Size";
      const detailCell = `<strong>${name}</strong><br>${detailLabel}: ${size}`;

      tr.innerHTML = `
        <td>${imageCell}</td>
        <td>${detailCell}</td>
        <td>$${price}</td>
        <td><button class="remove-btn" onclick="removeItem(${index})">Remove</button></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("cart-total").textContent = `Total: $${total}`;
  }

  function removeItem(index) {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
  }

  function checkout() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];

    fetch("https://surfz-backend.onrender.com/create-checkout-session", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ items: cart })
    })
    .then(res => res.json())
    .then(data => {
      if (data.url) {
        window.location.href = data.url;
      } else {
        alert("Stripe session failed to start.");
        console.warn("⚠️ Stripe session not started:", data);
      }
    })
    .catch(err => {
      console.error("❌ Checkout error:", err);
      alert("Error creating checkout session.");
    });
  }

  loadCart();
</script>

</body>
</html>
